name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test PrepiskaLauncher.sln -c Release

      - name: Publish
        run: dotnet publish src/PrepiskaLauncher/PrepiskaLauncher.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: PREPISKA-DayZ-Launcher
          path: publish/

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, mbstring
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tests
        run: vendor/bin/phpunit

      - name: Lint container and templates
        run: |
          php bin/console lint:container
          php bin/console lint:twig templates