name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  launcher:
    runs-on: windows-latest
    env:
      SIGNING_CERT: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test PrepiskaLauncher.sln -c Release

      - name: Publish
        run: dotnet publish src/PrepiskaLauncher/PrepiskaLauncher.csproj -c Release -o publish

      # Подпись exe: добавьте в Secrets репозитория сертификат (base64 от .pfx) и пароль,
      # тогда Windows SmartScreen перестанет показывать «неизвестный издатель».
      - name: Sign
        if: env.SIGNING_CERT != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "publish/PREPISKA DayZ Launcher.exe" "publish/WorkshopHelper.exe"
          Remove-Item cert.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: PREPISKA-DayZ-Launcher
          path: publish/

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: for f in server/*.php server/api/*.php; do php -l "$f"; done
