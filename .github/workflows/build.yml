name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test PrepiskaLauncher.sln -c Release

      - name: Publish
        run: dotnet publish src/PrepiskaLauncher/PrepiskaLauncher.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: PREPISKA-DayZ-Launcher
          path: publish/

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: for f in server/*.php server/api/*.php; do php -l "$f"; done
