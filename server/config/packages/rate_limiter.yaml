framework:
    rate_limiter:
        # События лаунчера: heartbeat раз в 5 минут + редкие start/play. С одного IP может сидеть
        # несколько игроков (общий NAT), поэтому лимит с запасом.
        launcher_events:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        # Форма поддержки: не больше 5 обращений в час с одного IP.
        support:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            support:
                policy: sliding_window
                limit: 100000
                interval: '1 hour'
