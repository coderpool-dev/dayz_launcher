# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Версия в адресах asset() (…/landing.css?4) — увеличить при изменении стилей или картинок лендинга,
    # чтобы браузеры не показывали старые из кэша.
    assets:
        version: '14'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
