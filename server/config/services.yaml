parameters:
    # Файлы приложения (снимок списка серверов, установщики лаунчера) — отдельно для каждого окружения.
    app.data_dir: '%kernel.project_dir%/var/%kernel.environment%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\ServerList\ServerListStore:
        arguments:
            $directory: '%app.data_dir%/servers'

    App\ServerList\ServerListProviderInterface:
        alias: App\ServerList\ServerListProvider

    App\ServerList\CachedServerListProvider:
        decorates: App\ServerList\ServerListProviderInterface
        arguments:
            $inner: '@.inner'

    App\Release\ReleaseStorage:
        arguments:
            $directory: '%app.data_dir%/releases'
